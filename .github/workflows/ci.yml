name: AXI4-Lite verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install guide dependencies
        run: >-
          dnf install -y git gcc gcc-c++ make autoconf automake flex bison
          help2man perl zlib-devel python3 python3-devel iverilog yosys z3 curl tar
      - uses: actions/checkout@v4
      - name: Inspect development packages
        run: make packages
      - name: Build pinned toolchain
        run: make toolchain JOBS=2
      - name: Inspect environment
        run: make env-check
      - name: Execute actual UVM smoke
        run: make uvm-smoke SEED=42 JOBS=2
      - name: Lint synthesizable RTL
        run: make lint
      - name: Execute directed and seeded RTL regression
        run: make regress-rtl JOBS=2
      - name: Execute full UVM regression
        run: make regress SEED=42 JOBS=2
      - name: Verify scoreboard negative control
        run: make test-uvm-negative SEED=42 JOBS=2
      - name: Detect three RTL mutations and rerun fixed design
        run: make mutation-checks SEED=42 JOBS=2
      - name: Merge measured functional and SVA coverage
        run: make coverage
      - name: Synthesize and verify the generated netlist
        run: make synth SEED=42 JOBS=2
      - name: Verify committed sources without existing build outputs
        run: make clean-checkout SEED=42 JOBS=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axi4lite-verification-evidence
          path: |
            build/**/*.log
            build/**/*.json
            build/**/*.vcd
            build/**/*.dat
            build/**/*.info
            build/synth/*.v
            build/synth/*.sv
            build/synth/*.ys
          if-no-files-found: warn
